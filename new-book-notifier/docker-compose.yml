services:
  new-book-notifier:
    build: .
    container_name: new-book-notifier
    ports:
      - "8002:8000"
    environment:
      - TZ=Asia/Taipei
      - DOWNLOAD_DIR=/app/downloads
      # API_URL to send webhook to Line-bot-llm-mysql
      - LINE_BOT_WEBHOOK_URL=http://localhost:3000/api/new-books/webhook 
    env_file:
      - .env
    network_mode: "host" # By passing localhost loopback for Webhook 
    volumes:
      - new_book_notifier_downloads:/app/downloads
      - new_book_notifier_output:/app/generated_documents
      - new_book_notifier_logs:/app/logs
      # During development, mount the src directory
      - ./src:/app/src 
    restart: unless-stopped

volumes:
  new_book_notifier_downloads:
    driver: local
  new_book_notifier_output:
    driver: local
  new_book_notifier_logs:
    driver: local
