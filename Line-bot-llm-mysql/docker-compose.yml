services:
  # LINE Bot Web Server
  line-bot-web:
    build: .
    container_name: line-bot-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Taipei
      - SCHEDULER_ENABLED=false # Disable scheduler in web service
    env_file:
      - .env
    # depends_on:
    #   - mysql
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

